# GitHub's own code scanning over the JavaScript and the workflows themselves: on every push to main, every pull
# request, and weekly, so a query added later still finds what is already here. Findings land in the Security tab.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        # `actions` reads the workflows for untrusted input reaching a script, over-broad tokens and unpinned actions.
        language: [javascript-typescript, actions]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
      security-events: write # to upload the findings to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
